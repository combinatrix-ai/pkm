name: Website
on:
  pull_request:
    paths: ['website/**', 'scripts/prepare-docs.mjs', 'scripts/capture-examples.py', 'docs/**', 'package.json', 'package-lock.json', '.github/workflows/website.yml']
  push:
    branches: [main]
    paths: ['website/**', 'scripts/prepare-docs.mjs', 'scripts/capture-examples.py', 'docs/**', 'package.json', 'package-lock.json', '.github/workflows/website.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run docs:build
      - uses: actions/upload-artifact@v4
        with:
          name: knapper-website
          path: website/.vitepress/dist
          retention-days: 7
