[package]
name = "pkm"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
description = "A headless CLI for markdown knowledge bases, built for AI agents"
license = "MIT"
repository = "https://github.com/combinatrix-ai/pkm"

[[bin]]
name = "pkm"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
walkdir = "2"
rayon = "1"
percent-encoding = "2"
chrono = "0.4"
anyhow = "1"
attestation-verify = { version = "0.1.0", optional = true }
uuid = { version = "1", features = ["v4"], optional = true }
tempfile = "3"
unicode-normalization = "0.1.26"

[features]
# Release binaries replace themselves with the next verified GitHub release.
# Builds without it (cargo install, local builds) only report updates.
self-update = ["dep:attestation-verify", "dep:uuid"]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# Vault-level behaviour is only real against a directory of files, so the
# tests that cover it build one.
tempfile = "3"
serde_yaml = "0.9"

[profile.release]
lto = true
codegen-units = 1
strip = true
